[workspace]
resolver = "2"
members = ["crates/runa-core", "crates/runa-cli", "gui/src-tauri"]
default-members = ["crates/runa-core", "crates/runa-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-name/runa"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks", "gzip"] }
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
