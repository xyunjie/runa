[package]
name = "runa-gui"
description = "Desktop GUI of runa (Tauri v2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version = "1.90"

[[bin]]
name = "runa-gui"
path = "src/main.rs"

[features]
# Serve the embedded gui/web/dist (custom protocol) also for plain `cargo build` / `cargo run`.
# `cargo tauri dev` drops this default feature and loads the Vite dev server (devUrl).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
runa-core = { path = "../../crates/runa-core" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tauri-plugin-dialog = "2"
