<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Runa</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">Runa</span>
      </div>
      <nav class="nav" aria-label="主导航">
        <a class="nav-item" href="#/overview" data-route="overview"><span class="nav-icon" data-icon="overview"></span>概览</a>
        <div class="nav-label">运行时</div>
        <div id="nav-tools"></div>
        <div class="nav-label">管理</div>
        <a class="nav-item" href="#/detect" data-route="detect"><span class="nav-icon" data-icon="scan"></span>检测与接管</a>
        <a class="nav-item" href="#/managers" data-route="managers"><span class="nav-icon" data-icon="package"></span>管理器</a>
        <a class="nav-item" href="#/settings" data-route="settings"><span class="nav-icon" data-icon="settings"></span>设置</a>
      </nav>
      <div class="sidebar-foot">
        <div class="seg seg-sm" id="theme-seg" role="radiogroup" aria-label="主题"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="crumb" id="crumb"></div>
        <div class="topbar-right">
          <label class="project" title="项目目录：决定「项目版本」写入哪里，以及当前生效的版本">
            <span data-icon="folder"></span>
            <input id="project" spellcheck="false" autocomplete="off" aria-label="项目目录" />
          </label>
          <button class="btn btn-icon btn-ghost" id="refresh" aria-label="刷新" title="刷新"><span data-icon="refresh"></span></button>
        </div>
      </header>
      <div class="content" id="content" tabindex="-1"></div>
    </main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>
</body>
</html>
